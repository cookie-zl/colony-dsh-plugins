name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 语法检查
        run: |
          set -e
          while IFS= read -r f; do node --check "$f"; done < <(find packages -name '*.js' -not -path '*/node_modules/*')

      - name: 包结构检查
        run: |
          set -e
          for d in packages/*/; do
            name=$(basename "$d")
            node -e "
              const fs = require('node:fs');
              const p = '$d/package.json';
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              const fail = (m) => { console.error('  ✗ ' + m); process.exit(1); };
              if (!j.name || !j.version) fail('$name: 缺 name/version');
              if (j.license !== 'Apache-2.0') fail('$name: license 必须是 Apache-2.0');
              if (!j.name.startsWith('@colony/dsh-')) fail('$name: 包名必须遵循 @colony/dsh-<name>（dsh 插件生态约定）');
              if (!(j.keywords || []).includes('dsh-plugin')) fail('$name: keywords 必须含 dsh-plugin，否则市场索引不到');
              if (!j.dsh?.bundle?.patch) fail('$name: 必须声明 dsh.bundle.patch，否则装进 profile 也不会生效');
              if (!fs.existsSync('$d/' + j.dsh.bundle.patch.replace('./', ''))) fail('$name: patch 文件不存在');
              if (!fs.existsSync('$d/index.js')) fail('$name: 缺 index.js');
              console.log('  ✓ ' + j.name + '@' + j.version);
            "
          done

      - name: 不能有 node_modules 或凭据
        run: |
          set -e
          if [ -n "$(git ls-files | grep -E 'node_modules/|\.env$|\.tgz$')" ]; then
            echo "仓库里不该有依赖目录、.env 或打包产物"; exit 1
          fi
          echo "干净"
